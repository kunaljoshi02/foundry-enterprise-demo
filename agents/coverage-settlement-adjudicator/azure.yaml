# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: coverage-settlement-adjudicator
services:
    agent-framework-agent-basic-responses:
        project: src/agent-framework-agent-basic-responses
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Insurance coverage determination and settlement adjudication specialist.
        kind: hosted
        name: coverage-settlement-adjudicator
        protocols:
            - protocol: responses
              version: 2.0.0
            - protocol: a2a
              version: 1.0.0
        agentEndpoint:
            protocols:
                - responses
                - a2a
        agentCard:
            description: "Determines policy coverage, checks exclusions, and calculates indicative settlement amounts for insurance claims."
            version: "1.0"
            skills:
                - id: coverage-determination
                  name: Coverage Determination
                  description: "Decides whether a described loss is covered under the cited policy sections."
                  tags: ["insurance", "coverage"]
                  examples: ["Is water damage from a burst pipe covered under HO-3 section 2.1?"]
                - id: exclusion-check
                  name: Exclusion Check
                  description: "Identifies applicable policy exclusions and cites the governing wording."
                  tags: ["insurance", "exclusions"]
                  examples: ["Does the hire-or-reward exclusion apply to a rideshare accident?"]
                - id: settlement-calculation
                  name: Settlement Calculation
                  description: "Computes an indicative settlement after deductibles, sub-limits and depreciation."
                  tags: ["insurance", "settlement"]
                  examples: ["Claim value 12000, deductible 1000, sub-limit 8000 - what is payable?"]
    ai-project:
        host: azure.ai.project
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
infra:
    provider: microsoft.foundry